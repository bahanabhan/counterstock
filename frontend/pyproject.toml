[project]
name = "db-frontend"
version = "0.1.0"
description = "Desktop-Frontend fuer die CounterStock REST API"
authors = [{ name = "Baha Eddine Nabhan" }]
requires-python = ">=3.11"
dependencies = [
    "requests>=2.32",
]

[project.scripts]
db-frontend = "db_frontend.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pyinstaller>=6.22.2",
]
